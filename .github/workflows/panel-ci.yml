name: Panel CI (build + unit + e2e + security scanning)

# EX-207 / EX-206 precondition (Tech Spec §7): the panel must build cleanly
# and pass dependency + secret scanning before it can be deployed. Runs on any
# change under panel/ and on the workflow itself.
#
# EX-603: the `e2e` job runs the @playwright/test suite (EX-602) headless
# against the EX-601 fixtures on every panel change, so no UI regression merges
# unseen. EX-604: the `unit` job runs the Vitest suite over the pure TS libs
# (+ TS↔Python parity) with a coverage threshold. Making these *required*
# status checks is a repo branch-protection setting the Founder applies (see
# docs/runbooks/panel-required-checks.md; enforced end to end in EX-606).

on:
  push:
    paths: ["panel/**", ".github/workflows/panel-ci.yml"]
  pull_request:
    paths: ["panel/**", ".github/workflows/panel-ci.yml"]

permissions:
  contents: read
  pull-requests: read   # gitleaks-action lists the PR's commits to scan them

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      - name: Build (tsc + next build)
        run: npm run build
        env:
          # a dummy secret so the build's env access doesn't throw; never a real one
          SESSION_SECRET: ci-build-only-not-a-real-secret

  e2e:
    name: Panel E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      # Cache the Playwright browser download keyed on the pinned version, so a
      # green run doesn't re-fetch chromium every time.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install chromium (+ OS deps)
        run: npx playwright install --with-deps chromium
      # The fixtures seed records via scripts/approval_engine.py — python3 is
      # preinstalled on ubuntu runners; this makes the dependency explicit.
      - name: Show tool versions
        run: node -v && python3 --version
      - name: Run e2e suite
        run: npm run test:e2e
      - name: Quality summary (e2e + a11y)
        if: always()
        run: |
          {
            echo "## Panel quality — e2e + a11y"
            echo "- Playwright suite (\`test/specs/*.spec.ts\`) over an isolated clone"
            echo "- Accessibility: axe-core WCAG 2.1 A/AA scan (zero critical/serious) + keyboard-only path"
            echo "- Result: \`${{ job.status }}\` — full report/traces attached as an artifact on failure"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report + traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            panel/playwright-report/
            panel/test-results/
          retention-days: 7
          if-no-files-found: ignore

  unit:
    name: Panel unit tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      # Vitest over the pure TS libs + TS↔Python parity (python3 preinstalled on
      # the runner). --coverage enforces the thresholds in vitest.config.ts.
      - name: Unit tests + coverage
        run: npm run test:unit:cov
      - name: Quality summary (unit)
        if: always()
        run: |
          {
            echo "## Panel quality — unit"
            if [ -f coverage/coverage-summary.json ]; then
              cov=$(node -p "Math.round(require('./coverage/coverage-summary.json').total.lines.pct)")
              echo "- Vitest over \`lib/\` + TS↔Python parity"
              echo "- Line coverage: **${cov}%** (threshold enforced in vitest.config.ts)"
            else
              echo "- Vitest run did not produce a coverage summary (tests likely failed above)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      # fail only on high/critical; moderate transitive advisories are triaged
      # in the security review (e.g. postcss via Next build tooling).
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
