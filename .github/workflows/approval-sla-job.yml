name: Approval SLA & escalation job

# EX-103/EX-104: the routing engine's heartbeat (Tech Spec 001 §4).
# Every ~15 min: skip unavailable humans, escalate SLA breaches one hop,
# send email notifications (assigned / 50% SLA / escalated), rebuild the
# registry — then commit any record changes. Idempotent: append-only
# hops/notified logs make re-runs no-ops (ADR-0004: never auto-approves).
#
# Email needs repo secrets: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS,
# NOTIFY_FROM. Without them the job still routes/escalates and logs what
# it would have sent.
#
# Slack (EX-303): SLACK_WEBHOOK_URL (repository secret, or variable) posts
# gate events to a channel with a deep link. IMPORTANT: this is a GitHub
# Action — it reads GitHub repo secrets/variables, NOT Vercel env vars; a
# webhook added only in Vercel is invisible here. To DM approvers individually
# instead, add a `slack_id` to each company/org/humans/*.md and a repo secret
# SLACK_BOT_TOKEN. Slack down or unconfigured never blocks routing — email
# still delivers (UC3).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: approval-sla-job
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # SMTP + Slack config lives as ENVIRONMENT secrets under the `prod`
    # environment (not `production` — that name was wrong and resolved empty).
    # The job must enter `prod` to read them. `prod` has "No restriction" on
    # deployment branches and no required reviewers, so this 15-min heartbeat
    # is not gated.
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Debug config presence (booleans only, no secret values)
        env:
          HAS_SECRET_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
          HAS_VAR_WEBHOOK: ${{ vars.SLACK_WEBHOOK_URL != '' }}
          HAS_VAR_PANEL: ${{ vars.PANEL_BASE_URL != '' }}
          HAS_SECRET_PANEL: ${{ secrets.PANEL_BASE_URL != '' }}
          HAS_SECRET_SMTP: ${{ secrets.SMTP_HOST != '' }}
          HAS_SECRET_BOT: ${{ secrets.SLACK_BOT_TOKEN != '' }}
        run: |
          echo "secret SLACK_WEBHOOK_URL present: $HAS_SECRET_WEBHOOK"
          echo "var    SLACK_WEBHOOK_URL present: $HAS_VAR_WEBHOOK"
          echo "var    PANEL_BASE_URL     present: $HAS_VAR_PANEL"
          echo "secret PANEL_BASE_URL     present: $HAS_SECRET_PANEL"
          echo "secret SMTP_HOST          present: $HAS_SECRET_SMTP"
          echo "secret SLACK_BOT_TOKEN    present: $HAS_SECRET_BOT"
      - name: Scan, escalate, notify
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          # Slack: webhook posts to the channel. Read from a secret OR a
          # variable (a webhook URL is a credential, so a secret is preferred).
          # PANEL_BASE_URL makes deep links land on the panel item.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
          PANEL_BASE_URL: ${{ vars.PANEL_BASE_URL || secrets.PANEL_BASE_URL }}
          # Bot token DMs approvers who have a `slack_id` in humans/*.md;
          # otherwise the webhook channel post is used.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python3 scripts/approval_engine.py scan --send-email --send-slack
      - name: Commit record changes
        run: |
          git config user.name "evalyn-approval-engine"
          git config user.email "evalyn-approvals@users.noreply.github.com"
          if ! git diff --quiet; then
            git add company/
            git commit -m "approval-engine: SLA scan $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push
          else
            echo "no changes"
          fi
