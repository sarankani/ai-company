name: Approval SLA & escalation job

# EX-103/EX-104: the routing engine's heartbeat (Tech Spec 001 §4).
# Every ~15 min: skip unavailable humans, escalate SLA breaches one hop,
# send email notifications (assigned / 50% SLA / escalated), rebuild the
# registry — then commit any record changes. Idempotent: append-only
# hops/notified logs make re-runs no-ops (ADR-0004: never auto-approves).
#
# Email needs repo secrets: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS,
# NOTIFY_FROM. Without them the job still routes/escalates and logs what
# it would have sent.
#
# Slack (EX-303): SLACK_WEBHOOK_URL (repo variable) posts gate events to a
# channel with a deep link. To DM approvers individually instead, add a
# `slack_id` to each company/org/humans/*.md AND make the prod-environment
# SLACK_BOT_TOKEN available by adding `environment: production` to the scan
# job below — but note that if the production environment has required-
# reviewer protection, this SCHEDULED heartbeat would be gated, so prefer a
# repo-level secret (or no protection) for an automated job. Slack down or
# unconfigured never blocks routing — email still delivers (UC3).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: approval-sla-job
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Enter the `production` environment so this job can read the Slack config
    # the Founder stored there — the prod-environment SLACK_BOT_TOKEN (secret)
    # and SLACK_WEBHOOK_URL / PANEL_BASE_URL (environment variables). At repo
    # scope these resolve to empty. ⚠️ The `production` environment must have
    # NO required-reviewer/deployment protection rules, or this SCHEDULED
    # heartbeat will be gated (wait for approval every 15 min). If you need
    # protection on that environment, move the Slack config to repo-level
    # (Actions secret + variable) and drop this line instead.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Scan, escalate, notify
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          # Slack config, read from the `production` environment (above):
          # webhook posts to the channel; PANEL_BASE_URL makes deep links land
          # on the panel item.
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          PANEL_BASE_URL: ${{ vars.PANEL_BASE_URL }}
          # Bot token DMs approvers who have a `slack_id` in humans/*.md;
          # otherwise the webhook channel post is used.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python3 scripts/approval_engine.py scan --send-email --send-slack
      - name: Commit record changes
        run: |
          git config user.name "evalyn-approval-engine"
          git config user.email "evalyn-approvals@users.noreply.github.com"
          if ! git diff --quiet; then
            git add company/
            git commit -m "approval-engine: SLA scan $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push
          else
            echo "no changes"
          fi
